<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🎉 忒修斯勇闯克里特岛迷宫 | 超有趣有声互动故事 🎉</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #0f2b3d 0%, #1b4d3e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI Emoji', cursive, sans-serif;
            padding: 20px;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="27" viewBox="0 0 24 27"><polygon points="2,2 22,13 12,16 2,25" fill="%23ffb347" stroke="%238b4513" stroke-width="1.5"/><circle cx="8" cy="10" r="2" fill="white"/></svg>') 4 2, auto;
        }

        .storybook {
            max-width: 1350px;
            width: 100%;
            background: #fff8e7;
            border-radius: 50px 50px 70px 70px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.4), inset 0 1px 4px rgba(255,255,200,0.8);
            overflow: hidden;
            animation: bookGlow 2s ease-in-out infinite;
        }

        @keyframes bookGlow {
            0%, 100% { box-shadow: 0 30px 50px rgba(0,0,0,0.4), inset 0 1px 4px rgba(255,255,200,0.8); }
            50% { box-shadow: 0 35px 60px rgba(255,180,50,0.3), inset 0 1px 4px rgba(255,255,200,0.9); }
        }

        .story-header {
            background: linear-gradient(135deg, #e6a157, #c97e2a);
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 6px solid #f3c26b;
            position: relative;
            overflow: hidden;
        }

        .story-header::before {
            content: "✨";
            position: absolute;
            font-size: 50px;
            opacity: 0.2;
            animation: starFloat 3s linear infinite;
        }

        @keyframes starFloat {
            0% { transform: translateX(-100%) rotate(0deg); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateX(1000%) rotate(360deg); opacity: 0; }
        }

        .story-header h1 {
            font-size: 1.5rem;
            color: #fff2cf;
            text-shadow: 3px 3px 0 #a05a1a;
            letter-spacing: 2px;
            background: rgba(0,0,0,0.2);
            padding: 5px 20px;
            border-radius: 50px;
            animation: bounce 2s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .sound-controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .sound-btn {
            background: #4a6b5f;
            border: none;
            font-size: 1.1rem;
            padding: 8px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.1s ease;
            box-shadow: 0 4px 0 #2d4a3e;
            position: relative;
            overflow: hidden;
        }

        .sound-btn:hover {
            transform: scale(1.05);
            background: #5d8a7a;
        }

        .sound-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #2d4a3e;
        }

        .sound-btn.active {
            background: #ffb347;
            color: #382008;
            box-shadow: 0 4px 0 #9b4a1a;
            animation: pulse 0.5s ease;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .bgm-toggle {
            background: #8b5e3c;
        }

        .story-content {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 25px;
        }

        .animation-area {
            flex: 1.5;
            min-width: 280px;
            background: linear-gradient(135deg, #f2e5c9, #ecdba8);
            border-radius: 35px;
            padding: 15px;
            box-shadow: inset 0 0 0 3px #fff9e8, 0 8px 20px rgba(0,0,0,0.1);
        }

        .canvas-wrapper {
            background: #f7e9cd;
            border-radius: 28px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        canvas {
            width: 100%;
            height: auto;
            display: block;
            background: #f7e9cd;
            transition: filter 0.3s;
        }

        .canvas-wrapper:hover canvas {
            filter: brightness(1.02);
        }

        .animation-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
        }

        .anim-btn {
            background: #ffb347;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            padding: 8px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 0 #9b4a1a;
            transition: 0.05s linear;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .anim-btn:hover {
            transform: scale(1.02);
            background: #ffc267;
        }

        .anim-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #9b4a1a;
        }

        .story-area {
            flex: 1;
            min-width: 280px;
            background: #fffef5;
            border-radius: 35px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08), inset 0 1px 0 white;
            display: flex;
            flex-direction: column;
        }

        .chapter-badge {
            background: linear-gradient(135deg, #e6a157, #d4892a);
            display: inline-block;
            padding: 8px 20px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            width: fit-content;
            margin-bottom: 12px;
            animation: badgeGlow 1.5s ease infinite;
        }

        @keyframes badgeGlow {
            0%, 100% { box-shadow: 0 2px 5px rgba(230,161,87,0.3); }
            50% { box-shadow: 0 4px 15px rgba(230,161,87,0.6); }
        }

        .story-text-box {
            flex: 1;
            overflow-y: auto;
            max-height: 400px;
            padding-right: 8px;
        }

        .story-paragraph {
            font-size: 1.1rem;
            line-height: 1.55;
            color: #3b2a1f;
            margin-bottom: 18px;
            background: #fef7e8;
            padding: 12px 15px;
            border-radius: 24px;
            border-left: 8px solid #f3bc6c;
            transition: all 0.3s;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .story-paragraph:hover {
            transform: translateX(5px);
            background: #fff5e0;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 20px;
        }

        .nav-btn {
            background: #86b3a2;
            border: none;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            padding: 10px 0;
            border-radius: 40px;
            cursor: pointer;
            flex: 1;
            color: white;
            box-shadow: 0 4px 0 #4f6b5e;
            transition: all 0.1s;
            position: relative;
            overflow: hidden;
        }

        .nav-btn:hover {
            background: #9cc9b6;
            transform: scale(1.02);
        }

        .nav-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #4f6b5e;
        }

        .mind-corner {
            margin-top: 18px;
            background: linear-gradient(135deg, #e9f0d6, #d4e4b0);
            border-radius: 28px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 2px solid #c2d98b;
            font-size: 0.9rem;
            animation: mindPulse 2s ease infinite;
        }

        @keyframes mindPulse {
            0%, 100% { background: linear-gradient(135deg, #e9f0d6, #d4e4b0); }
            50% { background: linear-gradient(135deg, #f0f5e0, #e0efc0); }
        }

        .page-indicator {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            color: #b97f44;
            font-size: 0.9rem;
        }

        .voice-status {
            font-size: 0.8rem;
            background: #f0e0c0;
            padding: 6px 15px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 8px;
            transition: all 0.3s;
        }

        .celebration {
            position: fixed;
            pointer-events: none;
            font-size: 2rem;
            animation: floatUp 1s ease-out forwards;
            z-index: 1000;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) rotate(360deg);
            }
        }

        .click-effect {
            position: fixed;
            pointer-events: none;
            font-size: 1.5rem;
            animation: clickPop 0.3s ease-out forwards;
            z-index: 999;
        }

        @keyframes clickPop {
            0% {
                opacity: 1;
                transform: scale(0.5);
            }
            100% {
                opacity: 0;
                transform: scale(1.5);
            }
        }

        @media (max-width: 800px) {
            .story-content { flex-direction: column; }
            .story-paragraph { font-size: 1rem; }
            .story-header h1 { font-size: 1rem; }
            .sound-btn { font-size: 0.9rem; padding: 6px 12px; }
        }

        /* 滚动条美化 */
        .story-text-box::-webkit-scrollbar {
            width: 8px;
        }

        .story-text-box::-webkit-scrollbar-track {
            background: #f0e0c0;
            border-radius: 10px;
        }

        .story-text-box::-webkit-scrollbar-thumb {
            background: #e6a157;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="storybook">
    <div class="story-header">
        <h1>🏛️ 忒修斯勇闯克里特岛迷宫 🧶</h1>
        <div class="sound-controls">
            <button class="sound-btn" id="speakBtn">🔊 朗读本章</button>
            <button class="sound-btn" id="stopSpeakBtn">⏹️ 停止</button>
            <button class="sound-btn bgm-toggle" id="bgmToggleBtn">🎵 背景音乐</button>
        </div>
    </div>

    <div class="story-content">
        <div class="animation-area">
            <div class="canvas-wrapper">
                <canvas id="mazeCanvas" width="700" height="500" style="width:100%; height:auto; aspect-ratio:700/500"></canvas>
            </div>
            <div class="animation-controls">
                <button class="anim-btn" id="playAnimBtn">▶ 播放动画</button>
                <button class="anim-btn" id="resetAnimBtn">🔄 重置</button>
                <button class="anim-btn" id="confettiBtn">🎉 撒花庆祝</button>
            </div>
            <div class="mind-corner" id="mindCorner">
                <span>🧠✨</span>
                <span id="mindTip">⭐ 忒修斯的线团 = 数学中的"标记法"</span>
            </div>
        </div>

        <div class="story-area">
            <div class="chapter-badge" id="chapterBadge">第 1 章 · 可怕的迷宫</div>
            <div class="story-text-box" id="storyTextContainer"></div>
            <div class="nav-buttons">
                <button class="nav-btn" id="prevChapterBtn">◀ 上一章</button>
                <button class="nav-btn" id="nextChapterBtn">下一章 ▶</button>
            </div>
            <div class="page-indicator" id="pageIndicator">第 1 / 8 章</div>
            <div class="voice-status" id="voiceStatus">🎉 点击按钮，开始奇妙冒险！</div>
        </div>
    </div>
</div>

<script>
    (function(){
        // ======================= 音效系统 =======================
        // 创建简单的音效（使用Web Audio API生成趣味音效）
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let bgmSource = null;
        let bgmEnabled = false;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContextClass();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
        
        // 播放点击音效
        function playClickSound() {
            if (!audioCtx) return;
            try {
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = 880;
                gainNode.gain.value = 0.15;
                oscillator.type = 'sine';
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
                oscillator.stop(audioCtx.currentTime + 0.2);
            } catch(e) { console.log(e); }
        }
        
        // 播放欢呼声
        function playCheerSound() {
            if (!audioCtx) return;
            try {
                for(let i = 0; i < 3; i++) {
                    const oscillator = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    oscillator.frequency.value = 880 + i * 100;
                    gainNode.gain.value = 0.2;
                    oscillator.type = 'triangle';
                    oscillator.start(audioCtx.currentTime + i * 0.1);
                    gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + i * 0.1 + 0.5);
                    oscillator.stop(audioCtx.currentTime + i * 0.1 + 0.4);
                }
            } catch(e) {}
        }
        
        // 播放胜利音效
        function playVictorySound() {
            if (!audioCtx) return;
            try {
                const notes = [523.25, 587.33, 659.25, 783.99];
                notes.forEach((freq, i) => {
                    const oscillator = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    oscillator.frequency.value = freq;
                    gainNode.gain.value = 0.15;
                    oscillator.type = 'sine';
                    oscillator.start(audioCtx.currentTime + i * 0.15);
                    gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + i * 0.15 + 0.5);
                    oscillator.stop(audioCtx.currentTime + i * 0.15 + 0.4);
                });
            } catch(e) {}
        }
        
        // 播放叮咚声
        function playDingSound() {
            if (!audioCtx) return;
            try {
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = 1046.5;
                gainNode.gain.value = 0.1;
                oscillator.type = 'sine';
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
                oscillator.stop(audioCtx.currentTime + 0.25);
            } catch(e) {}
        }
        
        // 播放BGM（简单的循环旋律）
        let bgmInterval = null;
        function startBGM() {
            if (bgmInterval) stopBGM();
            if (!audioCtx) initAudio();
            let noteIndex = 0;
            const melody = [523.25, 587.33, 659.25, 523.25, 587.33, 783.99, 698.46, 659.25];
            bgmInterval = setInterval(() => {
                if (!bgmEnabled || !audioCtx) return;
                try {
                    const oscillator = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    oscillator.frequency.value = melody[noteIndex % melody.length];
                    gainNode.gain.value = 0.05;
                    oscillator.type = 'sine';
                    oscillator.start();
                    gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.4);
                    oscillator.stop(audioCtx.currentTime + 0.35);
                    noteIndex++;
                } catch(e) {}
            }, 450);
        }
        
        function stopBGM() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }
        
        // 视觉特效：撒花
        function createConfetti() {
            playCheerSound();
            for(let i = 0; i < 50; i++) {
                const emojis = ['🎉', '✨', '⭐', '🌟', '🎊', '🏆', '🧶', '🏛️'];
                const confetti = document.createElement('div');
                confetti.className = 'celebration';
                confetti.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.top = '50%';
                confetti.style.fontSize = (20 + Math.random() * 30) + 'px';
                confetti.style.animationDuration = (0.8 + Math.random() * 0.5) + 's';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 1000);
            }
        }
        
        // 点击特效
        function createClickEffect(e) {
            const rect = e.target.getBoundingClientRect();
            const x = e.clientX || rect.left + rect.width/2;
            const y = e.clientY || rect.top + rect.height/2;
            const effect = document.createElement('div');
            effect.className = 'click-effect';
            effect.textContent = '✨';
            effect.style.left = x + 'px';
            effect.style.top = y + 'px';
            document.body.appendChild(effect);
            setTimeout(() => effect.remove(), 300);
            playClickSound();
        }
        
        // ======================= 语音合成 =======================
        let speechSynthesis = window.speechSynthesis;
        let currentUtterance = null;
        let isSpeaking = false;
        
        function getPlainTextFromChapter(text) {
            let temp = text.replace(/<br>/g, ' ');
            temp = temp.replace(/<strong>/g, '');
            temp = temp.replace(/<\/strong>/g, '');
            temp = temp.replace(/<[^>]*>/g, '');
            return temp;
        }
        
        function speakCurrentChapter() {
            if (!window.speechSynthesis) {
                alert("抱歉，您的浏览器不支持语音朗读功能");
                return;
            }
            initAudio();
            if (currentUtterance) {
                speechSynthesis.cancel();
            }
            const chapterDiv = document.getElementById('storyTextContainer');
            const plainText = getPlainTextFromChapter(chapterDiv.innerText);
            if (!plainText.trim()) return;
            currentUtterance = new SpeechSynthesisUtterance(plainText);
            currentUtterance.lang = 'zh-CN';
            currentUtterance.rate = 1.1;      // 语速更快一档
            currentUtterance.pitch = 1.3;      // 音调更高一度
            currentUtterance.volume = 1;
            
            currentUtterance.onstart = function() {
                isSpeaking = true;
                document.getElementById('voiceStatus').innerHTML = '🔊 正在讲故事... 🎤 语速加快，音调升高咯！';
                document.getElementById('voiceStatus').style.background = '#c8e6b5';
                playDingSound();
            };
            
            currentUtterance.onend = function() {
                isSpeaking = false;
                document.getElementById('voiceStatus').innerHTML = '✅ 故事讲完啦！点击🎉撒花庆祝吧！';
                document.getElementById('voiceStatus').style.background = '#f0e0c0';
                currentUtterance = null;
                playVictorySound();
            };
            
            speechSynthesis.speak(currentUtterance);
        }
        
        function stopSpeaking() {
            if (speechSynthesis) {
                speechSynthesis.cancel();
                isSpeaking = false;
                currentUtterance = null;
                document.getElementById('voiceStatus').innerHTML = '⏹️ 已停止朗读，点击"朗读本章"继续听';
                document.getElementById('voiceStatus').style.background = '#f0e0c0';
            }
        }
        
        // ======================= 迷宫定义 =======================
        const canvas = document.getElementById('mazeCanvas');
        const ctx = canvas.getContext('2d');
        const cellW = 41.2;
        const cellH = 45.45;
        const cols = 17;
        const rows = 11;
        
        let wallEast = Array(rows).fill().map(() => Array(cols).fill(true));
        let wallSouth = Array(rows).fill().map(() => Array(cols).fill(true));
        
        function buildMaze() {
            for(let i=0;i<rows;i++){
                for(let j=0;j<cols;j++){
                    wallEast[i][j] = true;
                    wallSouth[i][j] = true;
                }
            }
            for(let y=0; y<rows; y++){
                for(let x=0; x<cols-1; x++){
                    if(y===1 && x>=1 && x<=4) wallEast[y][x]=false;
                    if(y===3 && x>=1 && x<=7) wallEast[y][x]=false;
                    if(y===5 && x>=3 && x<=9) wallEast[y][x]=false;
                    if(y===7 && x>=2 && x<=12) wallEast[y][x]=false;
                    if(y===9 && x>=1 && x<=14) wallEast[y][x]=false;
                }
            }
            for(let y=0; y<rows-1; y++){
                if(y>=0 && y<=1) wallSouth[y][1]=false;
                if(y>=1 && y<=3) wallSouth[y][3]=false;
                if(y>=3 && y<=5) wallSouth[y][5]=false;
                if(y>=5 && y<=7) wallSouth[y][7]=false;
                if(y>=7 && y<=9) wallSouth[y][9]=false;
                if(y>=9 && y<=10) wallSouth[y][11]=false;
                if(y>=9 && y<=9) wallSouth[y][13]=false;
                if(y>=1 && y<=3) wallSouth[y][4]=false;
                if(y>=3 && y<=5) wallSouth[y][8]=false;
                if(y>=7 && y<=9) wallSouth[y][12]=false;
            }
            wallSouth[0][1] = false;
            wallEast[9][14] = false;
        }
        
        function getStoryPath(){
            return [
                [1,0],[1,1],[2,1],[3,1],[4,1],[4,2],[4,3],[3,3],[2,3],[2,4],[2,5],
                [3,5],[4,5],[5,5],[6,5],[7,5],[8,5],[9,5],[9,6],[9,7],[8,7],[7,7],
                [6,7],[5,7],[5,8],[5,9],[6,9],[7,9],[8,9],[9,9],[10,9],[11,9],[12,9],
                [13,9],[14,9]
            ];
        }
        
        let fullPath = getStoryPath();
        let princePos = {x:1, y:0};
        let threadPoints = [];
        let animationId = null;
        let isAnimating = false;
        
        function drawMaze(prince, threadHistory, showMonster=true){
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = "#f7e9cd";
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = "#b97f44";
            for(let y=0; y<rows; y++){
                for(let x=0; x<cols; x++){
                    let px = x*cellW;
                    let py = y*cellH;
                    if(wallEast[y][x]){
                        ctx.beginPath();
                        ctx.moveTo(px+cellW, py);
                        ctx.lineTo(px+cellW, py+cellH);
                        ctx.stroke();
                    }
                    if(wallSouth[y][x]){
                        ctx.beginPath();
                        ctx.moveTo(px, py+cellH);
                        ctx.lineTo(px+cellW, py+cellH);
                        ctx.stroke();
                    }
                }
            }
            ctx.strokeRect(0,0,canvas.width,canvas.height);
            ctx.font = "bold 20px 'Segoe UI Emoji'";
            ctx.fillStyle = "#2e7d32";
            ctx.fillText("🚪", 1*cellW+12, 0*cellH+32);
            if(showMonster){
                ctx.font = "30px 'Segoe UI Emoji'";
                ctx.fillStyle = "#b45f2b";
                ctx.fillText("🐂👹", 14*cellW+5, 9*cellH+38);
            } else {
                ctx.fillText("🏁", 14*cellW+12, 9*cellH+38);
            }
            if(threadHistory.length>1){
                ctx.beginPath();
                ctx.lineWidth = 5;
                ctx.strokeStyle = "#e34234";
                ctx.lineCap = "round";
                for(let i=0;i<threadHistory.length-1;i++){
                    let p1=threadHistory[i];
                    let p2=threadHistory[i+1];
                    ctx.beginPath();
                    ctx.moveTo(p1.x*cellW+cellW/2, p1.y*cellH+cellH/2);
                    ctx.lineTo(p2.x*cellW+cellW/2, p2.y*cellH+cellH/2);
                    ctx.stroke();
                }
                let start = threadHistory[0];
                ctx.fillStyle = "#e34234";
                ctx.beginPath();
                ctx.arc(start.x*cellW+cellW/2, start.y*cellH+cellH/2, 8,0,2*Math.PI);
                ctx.fill();
                ctx.fillStyle="white";
                ctx.font="14px sans-serif";
                ctx.fillText("🧶", start.x*cellW+cellW/2-6, start.y*cellH+cellH/2+5);
            }
            let px = prince.x*cellW+cellW/2;
            let py = prince.y*cellH+cellH/2;
            ctx.font = "32px 'Segoe UI Emoji'";
            ctx.fillStyle = "#2c3e66";
            ctx.fillText("🤴", px-16, py+12);
            ctx.font = "bold 14px sans-serif";
            ctx.fillStyle = "#1e3c2c";
            ctx.fillText("忒修斯", px-18, py-8);
        }
        
        function resetToStart(){
            if(animationId) {
                clearTimeout(animationId);
                animationId = null;
            }
            isAnimating=false;
            princePos = {x:1, y:0};
            threadPoints = [{x:1,y:0}];
            drawMaze(princePos, threadPoints, true);
        }
        
        function animateFullPath(){
            if(isAnimating) return;
            resetToStart();
            let idx = 1;
            isAnimating = true;
            function step(){
                if(idx >= fullPath.length){
                    isAnimating=false;
                    animationId=null;
                    playVictorySound();
                    createConfetti();
                    return;
                }
                let node = fullPath[idx];
                princePos = {x:node[0], y:node[1]};
                threadPoints.push({x:node[0], y:node[1]});
                drawMaze(princePos, threadPoints, true);
                if(idx === fullPath.length-1) playDingSound();
                idx++;
                animationId = setTimeout(() => {
                    requestAnimationFrame(step);
                }, 220);
            }
            requestAnimationFrame(step);
        }
        
        // ================= 故事章节 =================
        const chapters = [
            { title: "第 1 章 · 可怕的迷宫 🏛️", text: "🏛️ 很久很久以前，在地中海的克里特岛上，有一位国王修建了一座谁也无法走出来的<strong>超级迷宫</strong>！里面弯弯曲曲，到处都是死胡同和假门，进去了就再也找不到出口……更可怕的是，迷宫里住着一个<strong>牛头怪——米诺陶诺斯</strong>！每年都要送孩子进去，再也没有出来过……😱" },
            { title: "第 2 章 · 勇敢的王子 🦸", text: "🦸 在遥远的雅典城，有一位年轻勇敢的王子，名叫<strong>忒修斯</strong>。他听说这件事后，非常愤怒！他握紧拳头说：<strong>“我要去克里特岛，杀掉牛头怪，救出所有人！”</strong> 老国王流着泪劝阻，但忒修斯拍了拍胸脯：“我不只勇敢，我还会动脑筋！”于是，他乘着白色船帆的大船出发了！⛵" },
            { title: "第 3 章 · 公主的礼物 🎁", text: "👸 忒修斯到达克里特岛后，遇到了善良的<strong>阿里阿德涅公主</strong>。公主很佩服王子的勇气，悄悄给了他一个<strong>神秘的武器</strong>——不是剑，不是盾，而是一个<strong>🧶 大线团！</strong> 公主小声说：“把线头系在迷宫入口，一边走一边放线，打败怪物后顺着线就能回家！” 忒修斯眼睛一亮：“太聪明啦！”✨" },
            { title: "第 4 章 · 走进迷宫 🚶", text: "🚶‍♂️ 忒修斯把线头牢牢系在门口的柱子上，深吸一口气，走进了黑漆漆的迷宫。身后的大门<strong>砰</strong>地关上了！每遇到岔路口，他就做出选择：左？右？直走？有时走进死胡同，他就退回再试。身后的红线像一条<strong>会发光的小路</strong>，悄悄告诉他：“你走过这里哦！”🔴" },
            { title: "第 5 章 · 决战牛头怪 ⚔️", text: "⚔️ 走着走着，一阵臭味飘来——牛头怪就在附近！突然，<strong>“吼——！！！”</strong> 米诺陶诺斯冲了出来，眼睛像火球，牛角像弯刀！忒修斯没有逃跑，举起利剑左躲右闪，像一只灵活的猫。最后他看准机会，<strong>“哈！”</strong> 一剑打败了牛头怪！迷宫安静了下来……🏆" },
            { title: "第 6 章 · 线团带回家 🧶", text: "🧶 忒修斯擦了擦汗，转过身——那根红红的线团安安静静躺在地上，像一位可靠的朋友。他高兴地说：“老朋友，现在轮到你带我回家啦！”他顺着红线左转右转，绕过死胡同……不一会儿，前方出现了亮光——<strong>迷宫大门！</strong> 所有孩子都跟着忒修斯走出了迷宫，从此再也没有孩子被送进去了！🎉" },
            { title: "第 7 章 · 数学思维宝藏 🧠✨", text: "🧠✨ 小朋友，你知道吗？忒修斯的线团藏着<strong>三种数学思维</strong>：<br> 🎯 <strong>起点和终点</strong>：系线团的地方是起点，牛头怪是终点。<br> 🧩 <strong>岔路选择</strong>：遇到岔路就像做选择题，错了就换一条。<br> 📍 <strong>标记路线</strong>：红线帮他记住走过的路，绝不重复犯错！这就是你的“数学线团”！📚" },
            { title: "第 8 章 · 你就是小英雄 🌟", text: "🎉 下次遇到难题或迷宫，不要害怕！想一想勇敢的忒修斯，想一想聪明的线团。<strong>迷宫不是困住你的墙，而是训练你思维的游乐场！</strong> 你也能像忒修斯一样，用勇气+方法，找到每一个问题的出口！<br><br> 🌟 记住：带上你的“数学线团”出发吧！🧶🎊" }
        ];
        
        let currentChapter = 0;
        
        function renderChapter(index){
            const chap = chapters[index];
            document.getElementById('chapterBadge').innerHTML = chap.title;
            const container = document.getElementById('storyTextContainer');
            container.innerHTML = `<div class="story-paragraph">${chap.text}</div>`;
            document.getElementById('pageIndicator').innerHTML = `第 ${index+1} / ${chapters.length} 章`;
            playDingSound();
            
            const tipSpan = document.getElementById('mindTip');
            if(index === 6){
                tipSpan.innerHTML = "🎯 数学思维1:起点终点  🧩 2:岔路选择  📍 3:标记路线 🧠✨";
            } else if(index === 3){
                tipSpan.innerHTML = "🧶 看左边！红线就是忒修斯的魔法线团～ 像数学题中的画图法！";
            } else if(index === 5){
                tipSpan.innerHTML = "✨ 顺着红线走出迷宫！像做数学题要检查步骤一样 📝";
            } else {
                tipSpan.innerHTML = "⭐ 忒修斯的线团 = 数学中的“标记法” 🧶 = ✏️ 在纸上画图标记";
            }
            
            if(index === 0) resetToStart();
            if(index === 3 || index === 4){
                if(threadPoints.length<10) resetToStart();
                drawMaze(princePos, threadPoints, true);
            }
            if(index === 5){
                princePos = {x:fullPath[fullPath.length-1][0], y:fullPath[fullPath.length-1][1]};
                threadPoints = fullPath.map(p=>({x:p[0],y:p[1]}));
                drawMaze(princePos, threadPoints, true);
                createConfetti();
            }
            if(index === 6 || index === 7){
                drawMaze(princePos, threadPoints, true);
            }
            if(index === 1 || index === 2){
                resetToStart();
            }
            stopSpeaking();
        }
        
        function nextChapter(){
            if(currentChapter < chapters.length-1){
                currentChapter++;
                renderChapter(currentChapter);
                if(currentChapter === 7) createConfetti();
            }
        }
        
        function prevChapter(){
            if(currentChapter > 0){
                currentChapter--;
                renderChapter(currentChapter);
            }
        }
        
        // 添加点击特效到所有按钮
        function addClickEffects() {
            const allButtons = document.querySelectorAll('button');
            allButtons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    createClickEffect(e);
                    e.stopPropagation();
                });
            });
            document.querySelectorAll('.canvas-wrapper, .story-paragraph').forEach(el => {
                el.addEventListener('click', (e) => createClickEffect(e));
            });
        }
        
        // 绑定事件
        document.getElementById('nextChapterBtn').addEventListener('click', nextChapter);
        document.getElementById('prevChapterBtn').addEventListener('click', prevChapter);
        document.getElementById('playAnimBtn').addEventListener('click', () => {
            animateFullPath();
            playDingSound();
        });
        document.getElementById('resetAnimBtn').addEventListener('click', () => {
            if(animationId) clearTimeout(animationId);
            isAnimating=false;
            resetToStart();
            playClickSound();
        });
        document.getElementById('speakBtn').addEventListener('click', () => {
            initAudio();
            speakCurrentChapter();
        });
        document.getElementById('stopSpeakBtn').addEventListener('click', stopSpeaking);
        document.getElementById('confettiBtn').addEventListener('click', () => {
            createConfetti();
            playVictorySound();
        });
        
        let bgmOn = false;
        document.getElementById('bgmToggleBtn').addEventListener('click', () => {
            initAudio();
            bgmOn = !bgmOn;
            bgmEnabled = bgmOn;
            if (bgmOn) {
                startBGM();
                document.getElementById('bgmToggleBtn').innerHTML = '🎵 音乐开';
                document.getElementById('bgmToggleBtn').style.background = '#ffb347';
                playDingSound();
            } else {
                stopBGM();
                document.getElementById('bgmToggleBtn').innerHTML = '🎵 背景音乐';
                document.getElementById('bgmToggleBtn').style.background = '#4a6b5f';
            }
        });
        
        buildMaze();
        resetToStart();
        renderChapter(0);
        addClickEffects();
        
        // 页面加载时初始化音频（用户首次点击时激活）
        document.body.addEventListener('click', function initAudioOnFirstClick() {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            document.body.removeEventListener('click', initAudioOnFirstClick);
        });
    })();
</script>
